[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "基于大模型与代码检索的本地工程代码助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "eval"]

no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
exclude = '(^|/)(\.venv|venv|build|dist|\.mypy_cache|\.pytest_cache)(/|$)|\.egg-info'

[[tool.mypy.overrides]]
module = ["rank_bm25", "rank_bm25.*", "chromadb", "chromadb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
